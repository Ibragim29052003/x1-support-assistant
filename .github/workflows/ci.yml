name: Проверка

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --frozen
      - run: uv run --project backend ruff check backend scripts
      - run: uv run --project backend ruff format --check backend scripts
      - run: uv run --project backend pytest backend/tests -q
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker build -t x1-support .
