[project]
name = "x1-support"
version = "0.1.0"
description = "Ассистент магазина с ответами по регламенту"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["httpx2", "pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
